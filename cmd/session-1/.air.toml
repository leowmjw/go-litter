root = "."
tmp_dir = ".air-session-1"

[build]
cmd = "go build -o ./.air-session-1/session-1 ./cmd/session-1"
bin = "./.air-session-1/session-1"
args_bin = ["-temporal-address=127.0.0.1:7233"]
include_ext = ["go", "toml"]
exclude_dir = [".air-session-1", ".data", ".git", ".temporal", "ARCHIVE", "EXAMPLE"]
stop_on_error = true
send_interrupt = true
kill_delay = "500ms"
