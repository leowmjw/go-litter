root = "."
tmp_dir = ".air-quick-tutorial-tutorial"

[build]
cmd = "go build -o ./.air-quick-tutorial-tutorial/quick-tutorial ./cmd/quick-tutorial"
bin = "./.air-quick-tutorial-tutorial/quick-tutorial"
args_bin = ["tutorial"]
include_ext = ["go", "toml"]
exclude_dir = [".air-quick-tutorial", ".air-quick-tutorial-tutorial", ".data", ".git", ".temporal", "ARCHIVE", "EXAMPLE"]
stop_on_error = true
send_interrupt = true
kill_delay = "500ms"
