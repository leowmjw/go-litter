root = "."
tmp_dir = ".air-session-5"

[build]
cmd = "go build -o ./.air-session-5/session-5 ./cmd/session-5"
bin = "./.air-session-5/session-5"
args_bin = ["-temporal-address=127.0.0.1:7233"]
include_ext = ["go", "toml"]
exclude_dir = [".air-session-5", ".data", ".git", ".temporal", "ARCHIVE", "EXAMPLE"]
stop_on_error = true
send_interrupt = true
kill_delay = "500ms"
